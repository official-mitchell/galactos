# One-off: produce the Playwright linux snapshot for MAX-996. Delete after the PNG is committed.
name: linux snapshot

on:
  workflow_dispatch:

jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run shot:update

      - uses: actions/upload-artifact@v4
        with:
          name: linux-snapshot
          path: tests/final-state.spec.ts-snapshots/*linux*.png
          if-no-files-found: error
