<!doctype html>
<!-- 2026-11-03: MAX-996 applies ?mode= and ?motion= before paint. ?mode= still wins.
     2026-11-03: MAX-997 preloads the variable Fraunces and Inter files.
     2026-11-03: MAX-1003 sets .dark from localStorage galactos-theme, else prefers-color-scheme, before first paint. Sets window.__galactosThemeSource to stored or system.
     2026-11-04: MAX-1005 starts as no-js and swaps to js in the inline script so hidden motion states stay under .js. -->
<html lang="en" class="no-js">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var q = new URLSearchParams(location.search);
        var mode = q.get('mode');
        var motion = q.get('motion');
        var source = 'system';
        if (mode === 'dark' || mode === 'light') {
          try { localStorage.setItem('galactos-theme', mode); } catch (e) {}
          source = 'stored';
        } else {
          try {
            var stored = localStorage.getItem('galactos-theme');
            if (stored === 'dark' || stored === 'light') {
              mode = stored;
              source = 'stored';
            }
          } catch (e) {}
          if (mode !== 'dark' && mode !== 'light') {
            mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            source = 'system';
          }
        }
        document.documentElement.classList.remove('no-js');
        document.documentElement.classList.add('js');
        document.documentElement.classList.toggle('dark', mode === 'dark');
        window.__galactosThemeSource = source;
        if (motion === 'final' || motion === 'reduced' || motion === 'live') {
          document.documentElement.setAttribute('data-motion', motion);
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="./assets/fonts/Fraunces[SOFT,WONK,opsz,wght].woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="./assets/fonts/InterVariable.woff2" />
    <title>Galactos</title>
    <!-- 2026-11-03: Plausible snippet from the site install. MAX-1048. -->
    <script async src="https://plausible.io/js/pa-xvK14GZHzykMbB_2ixEOP.js"></script>
    <script>
      window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
      plausible.init()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
